name: ResourceManager Build and Lifecycle Tests

on:
  push:
    branches:
      - quest-restart-feature
  pull_request:
    branches:
      - quest-restart-feature
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-manager-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build libultraship and test ResourceManager lifecycle
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        working-directory: src/2ship2harkinian/libultraship
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) \
            build-essential cmake ninja-build python3 python3-pip wget \
            gcc-12 g++-12

      - name: Install SDL 2.24.1
        run: |
          wget -q https://www.libsdl.org/release/SDL2-2.24.1.tar.gz
          tar -xzf SDL2-2.24.1.tar.gz
          cd SDL2-2.24.1
          ./configure
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Install tinyxml2 10.0.0
        run: |
          wget -q https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz
          cmake -S tinyxml2-10.0.0 -B tinyxml2-10.0.0/build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build tinyxml2-10.0.0/build --parallel "$(nproc)"
          sudo cmake --install tinyxml2-10.0.0/build
          sudo ldconfig

      - name: Install Python dependencies
        working-directory: src/2ship2harkinian/libultraship
        run: |
          python3 -m pip install -r requirements.txt --break-system-packages \
            || python3 -m pip install -r requirements.txt

      - name: Generate ResourceManager lifecycle regression tests
        working-directory: src/2ship2harkinian/libultraship
        run: |
          cat > tests/resource_manager_ci_tests.cpp <<'EOF'
          #include <gtest/gtest.h>
          #include <ship/resource/ResourceManager.h>
          #include <ship/resource/Resource.h>

          #include <atomic>
          #include <functional>
          #include <memory>

          namespace {

          class LifecycleProbeResource final : public Ship::IResource {
          public:
              explicit LifecycleProbeResource(std::function<void()> onDestroy = {})
                  : Ship::IResource(nullptr), mOnDestroy(std::move(onDestroy)) {}

              ~LifecycleProbeResource() override {
                  if (mOnDestroy) {
                      mOnDestroy();
                  }
              }

              void* GetRawPointer() override {
                  return &mPayload;
              }

              size_t GetPointerSize() override {
                  return sizeof(mPayload);
              }

          private:
              int mPayload = 42;
              std::function<void()> mOnDestroy;
          };

          } // namespace

          TEST(ResourceManagerLifecycle, CachedResourceIsDestroyedWithManager) {
              std::atomic<bool> destroyed{false};

              {
                  Ship::ResourceManager manager;

                  auto resource = std::make_shared<LifecycleProbeResource>(
                      [&destroyed]() {
                          destroyed.store(true);
                      });

                  manager.CacheExternalResource("ci/lifecycle-probe", resource);
                  resource.reset();

                  ASSERT_NE(
                      manager.GetCachedResource("ci/lifecycle-probe"),
                      nullptr
                  );

                  EXPECT_FALSE(destroyed.load());
              }

              EXPECT_TRUE(destroyed.load())
                  << "ResourceManager destruction did not release its cached resource";
          }

          TEST(ResourceManagerLifecycle, RejectsExternalCacheInsertionAfterShutdown) {
              Ship::ResourceManager manager;

              auto accepted = std::make_shared<LifecycleProbeResource>();
              manager.CacheExternalResource("ci/accepted", accepted);

              ASSERT_NE(manager.GetCachedResource("ci/accepted"), nullptr);

              manager.StopAcceptingTasks();

              auto rejected = std::make_shared<LifecycleProbeResource>();
              manager.CacheExternalResource("ci/rejected", rejected);

              EXPECT_EQ(manager.GetCachedResource("ci/rejected"), nullptr)
                  << "CacheExternalResource accepted an insertion after shutdown began";

              EXPECT_NE(manager.GetCachedResource("ci/accepted"), nullptr)
                  << "An existing cache entry was unexpectedly removed";
          }

          TEST(ResourceManagerLifecycle, CacheDrainDestructorCanReenterManager) {
              std::atomic<bool> destructorRan{false};
              std::atomic<bool> reentryCompleted{false};

              {
                  Ship::ResourceManager manager;

                  auto resource = std::make_shared<LifecycleProbeResource>(
                      [&]() {
                          destructorRan.store(true);

                          // This callback runs during ResourceManager destruction,
                          // while DrainResourceCache() is executing.
                          // Re-entry must not deadlock on the cache mutex.
                          manager.SnapshotCachedResources();

                          reentryCompleted.store(true);
                      });

                  manager.CacheExternalResource("ci/reentrant-destructor", resource);
                  resource.reset();

                  EXPECT_FALSE(destructorRan.load());
              } // ResourceManager::~ResourceManager() drains the cache here.

              EXPECT_TRUE(destructorRan.load())
                  << "Cached resource was not destroyed during manager teardown";

              EXPECT_TRUE(reentryCompleted.load())
                  << "Resource destructor could not safely re-enter ResourceManager";
          }
          EOF

          echo 'target_sources(lus_tests PRIVATE resource_manager_ci_tests.cpp)' \
            >> tests/CMakeLists.txt

      - name: Configure libultraship with tests enabled
        working-directory: src/2ship2harkinian/libultraship
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLUS_BUILD_TESTS=ON

      - name: Build libultraship and lifecycle tests
        working-directory: src/2ship2harkinian/libultraship
        run: |
          cmake --build build-ci --parallel "$(nproc)"

      - name: Run all libultraship tests
        working-directory: src/2ship2harkinian/libultraship
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          ctest --test-dir build-ci --output-on-failure --timeout 120