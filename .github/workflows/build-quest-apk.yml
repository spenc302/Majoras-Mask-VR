
name: Build Majora's Mask VR Quest APK

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quest-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-quest-apk:
    name: Build Quest APK
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.30.3"

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          sdkmanager --install `
            "platforms;android-35" `
            "build-tools;35.0.0" `
            "ndk;27.0.12077973"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK component installation failed."
          }

          "ANDROID_HOME=$env:ANDROID_HOME" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          cmake --version
          if ($LASTEXITCODE -ne 0) {
            throw "CMake verification failed."
          }

          ninja --version
          if ($LASTEXITCODE -ne 0) {
            throw "Ninja verification failed."
          }

      - name: Set Android NDK environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ndkPath = Join-Path $env:ANDROID_HOME "ndk\27.0.12077973"

          if (!(Test-Path $ndkPath)) {
            throw "Android NDK not found: $ndkPath"
          }

          "ANDROID_NDK_HOME=$ndkPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "ANDROID_NDK_ROOT=$ndkPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Android NDK: $ndkPath"

      - name: Prepare build directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          @(
            "logs",
            "cache/tmp",
            "downloads",
            "toolchains",
            "run/vr-first-person"
          ) | ForEach-Object {
            New-Item -ItemType Directory -Force -Path $_ |
              Out-Null
          }

      - name: Verify build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          python --version
          cmake --version
          java -version
          ninja --version

          if ($LASTEXITCODE -ne 0) {
            throw "Build tool verification failed."
          }

      - name: Install vcpkg and OpenXR
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgRoot = Join-Path $PWD "toolchains\vcpkg"

          if (!(Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to clone vcpkg."
            }
          }

          $bootstrap = Join-Path $vcpkgRoot "bootstrap-vcpkg.bat"

          if (!(Test-Path $bootstrap)) {
            throw "vcpkg bootstrap script not found: $bootstrap"
          }

          & $bootstrap -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to bootstrap vcpkg."
          }

          $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"

          if (!(Test-Path $vcpkgExe)) {
            throw "vcpkg.exe was not created."
          }

          "VCPKG_ROOT=$vcpkgRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "VCPKG_DISABLE_METRICS=1" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          $env:VCPKG_ROOT = $vcpkgRoot
          $env:VCPKG_DISABLE_METRICS = "1"

          & $vcpkgExe install "openxr-loader:x64-windows-static"

          if ($LASTEXITCODE -ne 0) {
            throw "OpenXR loader dependency installation failed."
          }

          $openxrConfig = Join-Path $vcpkgRoot "installed\x64-windows-static\share\openxr-loader\OpenXRConfig.cmake"

          if (!(Test-Path $openxrConfig)) {
            Get-ChildItem `
              (Join-Path $vcpkgRoot "installed\x64-windows-static\share") `
              -Filter "*OpenXR*Config.cmake" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "OpenXRConfig.cmake was not found at the expected path: $openxrConfig"
          }

          Write-Host "OpenXR configuration found: $openxrConfig"

      - name: Prepare Windows build script
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $scriptPath = "tools/build-vr-first-person.ps1"

          if (!(Test-Path $scriptPath)) {
            throw "Windows build script not found: $scriptPath"
          }

          $content = Get-Content $scriptPath -Raw

          $content = $content.Replace(
            "VCPKG_MAX_CONCURRENCY='8'",
            "VCPKG_MAX_CONCURRENCY='2'"
          )

          $content = $content.Replace(
            "--parallel 8",
            "--parallel 2"
          )

          $content = $content.Replace(
            "share\openxr')",
            "share\openxr-loader')"
          )

          Set-Content -Path $scriptPath -Value $content -NoNewline

          $content = Get-Content $scriptPath -Raw

          if ($content.Contains("--parallel 8")) {
            throw "Failed to limit Windows build parallelism."
          }

          if (!$content.Contains("share\openxr-loader')")) {
            throw "Failed to update the OpenXR CMake directory."
          }

          Write-Host "Windows build script prepared."

      - name: Build Windows support archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          ./tools/build-vr-first-person.ps1 -Step All

          if ($LASTEXITCODE -ne 0) {
            throw "Windows support build failed."
          }

          $archive = "run/vr-first-person/2ship.o2r"

          if (!(Test-Path $archive -PathType Leaf)) {
            throw "Required support archive was not generated: $archive"
          }

          python -c "import sys,zipfile; p=sys.argv[1]; z=zipfile.ZipFile(p); bad=z.testzip(); assert bad is None, f'Corrupt archive entry: {bad}'; assert z.namelist(), 'Archive is empty'; print('Archive entries:', len(z.namelist())); z.close()" $archive

          if ($LASTEXITCODE -ne 0) {
            throw "Generated support archive failed validation."
          }

          Get-Item $archive |
            Format-List Name, Length, FullName

      - name: Configure Quest native build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          ./tools/build-quest.ps1 -Step Configure

          if ($LASTEXITCODE -ne 0) {
            throw "Quest CMake configuration failed."
          }

      - name: Build Quest native libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          ./tools/build-quest.ps1 -Step Native -Jobs 2

          if ($LASTEXITCODE -ne 0) {
            throw "Quest native compilation failed."
          }

      - name: Package Quest APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          ./tools/build-quest.ps1 -Step Apk

          if ($LASTEXITCODE -ne 0) {
            throw "Quest APK packaging failed."
          }

          $apk = "releases/quest-preview/MMVR-Quest-preview.apk"

          if (!(Test-Path $apk -PathType Leaf)) {
            throw "Expected APK was not created: $apk"
          }

          $file = Get-Item $apk

          if ($file.Length -le 0) {
            throw "Generated APK is empty."
          }

          $file | Format-List Name, Length, FullName
          Get-FileHash $apk -Algorithm SHA256

      - name: Upload Quest APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Majoras-Mask-VR-Quest-APK
          path: releases/quest-preview/MMVR-Quest-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majoras-Mask-VR-Build-Logs
          path: |
            logs/**/*.log
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
