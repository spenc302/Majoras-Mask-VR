
name: Build Majora's Mask VR Quest APK

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-quest-apk:
    name: Build Quest APK
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          sdkmanager --install `
            "platform-tools" `
            "platforms;android-35" `
            "build-tools;35.0.0" `
            "ndk;27.0.12077973" `
            "cmake;3.26.4"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK component installation failed"
          }

          "ANDROID_HOME=$env:ANDROID_HOME" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "$env:ANDROID_HOME\cmake\3.26.4\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set Android NDK environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ndkPath = Join-Path $env:ANDROID_HOME "ndk\27.0.12077973"

          if (!(Test-Path $ndkPath)) {
            throw "Android NDK not found at: $ndkPath"
          }

          "ANDROID_NDK_HOME=$ndkPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare build directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force `
            -Path logs, cache/tmp, downloads, toolchains, run/vr-first-person |
            Out-Null

          python --version
          if ($LASTEXITCODE -ne 0) {
            throw "Python verification failed"
          }

          cmake --version
          if ($LASTEXITCODE -ne 0) {
            throw "CMake verification failed"
          }

          java -version
          if ($LASTEXITCODE -ne 0) {
            throw "Java verification failed"
          }

      - name: Obtain real support archive from upstream
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseUrl = "https://api.github.com/repos/fulldivegames/Majoras-Mask-VR/releases/tags/v0.36"

          $release = Invoke-RestMethod `
            -Uri $releaseUrl `
            -Headers @{ "User-Agent" = "Majoras-Mask-VR-CI" }

          $asset = $release.assets |
            Where-Object {
              $_.name -match '(?i)windows.*\.zip$'
            } |
            Select-Object -First 1

          if (!$asset) {
            throw "Could not find a Windows ZIP asset in upstream release v0.36"
          }

          $downloadZip = Join-Path $env:RUNNER_TEMP $asset.name
          $extractDir = Join-Path $env:RUNNER_TEMP "mmvr-upstream-v036"

          Write-Host "Downloading upstream asset: $($asset.name)"

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $downloadZip

          if (!(Test-Path $downloadZip)) {
            throw "Upstream release download failed"
          }

          Expand-Archive `
            -LiteralPath $downloadZip `
            -DestinationPath $extractDir `
            -Force

          $supportArchive = Get-ChildItem `
            -LiteralPath $extractDir `
            -Filter "2ship.o2r" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (!$supportArchive) {
            throw "The upstream Windows ZIP did not contain 2ship.o2r. No placeholder will be used."
          }

          python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); assert z.testzip() is None; print('Validated support ZIP with', len(z.namelist()), 'entries')" $supportArchive.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "The upstream 2ship.o2r file is not a valid ZIP archive"
          }

          Copy-Item `
            -LiteralPath $supportArchive.FullName `
            -Destination "run/vr-first-person/2ship.o2r" `
            -Force

          Write-Host "Installed validated support archive."

      - name: Configure Quest native build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./tools/build-quest.ps1 -Step Configure

      - name: Build Quest native libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./tools/build-quest.ps1 -Step Native -Jobs 2

      - name: Package and sign Quest APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          ./tools/build-quest.ps1 -Step Apk

          $apk = "releases/quest-preview/MMVR-Quest-preview.apk"

          if (!(Test-Path $apk)) {
            throw "Expected APK was not created: $apk"
          }

          Get-Item $apk |
            Format-List Name, Length, FullName

          Get-FileHash $apk -Algorithm SHA256

      - name: Upload Quest APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Majoras-Mask-VR-Quest-APK
          path: releases/quest-preview/MMVR-Quest-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majoras-Mask-VR-Build-Logs
          path: |
            logs/**/*.log
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
