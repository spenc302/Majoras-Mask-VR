
name: Build Majora's Mask VR Quest APK

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quest-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-quest-apk:
    name: Build Windows support archive and Quest APK
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.3'

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973

      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          python --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Python is unavailable.'
          }

          cmake --version
          if ($LASTEXITCODE -ne 0) {
            throw 'CMake is unavailable.'
          }

          java -version
          if ($LASTEXITCODE -ne 0) {
            throw 'Java is unavailable.'
          }

          ninja --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Ninja is unavailable.'
          }

          if (-not $env:ANDROID_HOME) {
            throw 'ANDROID_HOME was not configured by setup-android.'
          }

          $ndk = Join-Path $env:ANDROID_HOME 'ndk\27.0.12077973'
          if (-not (Test-Path $ndk)) {
            throw "Required Android NDK was not found: $ndk"
          }

          "ANDROID_HOME=$env:ANDROID_HOME" |
            Out-File $env:GITHUB_ENV -Append

          "ANDROID_NDK_HOME=$ndk" |
            Out-File $env:GITHUB_ENV -Append

      - name: Prepare build directories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          @(
            'cache/tmp',
            'cache/vcpkg-binaries',
            'cache/android-user',
            'cache/gradle',
            'downloads/vcpkg',
            'logs',
            'toolchains'
          ) | ForEach-Object {
            New-Item -ItemType Directory -Force -Path $_ |
              Out-Null
          }

      - name: Install vcpkg and OpenXR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $root = $PWD.Path
          $vcpkgRoot = Join-Path $root 'toolchains\vcpkg'
          $vcpkgExe = Join-Path $vcpkgRoot 'vcpkg.exe'

          if (-not (Test-Path $vcpkgExe)) {
            if (Test-Path $vcpkgRoot) {
              $items = Get-ChildItem $vcpkgRoot -Force
              if ($items.Count -gt 0) {
                throw "vcpkg directory exists but is not bootstrapped: $vcpkgRoot"
              }
            } else {
              git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
              if ($LASTEXITCODE -ne 0) {
                throw 'Failed to clone vcpkg.'
              }
            }

            & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to bootstrap vcpkg.'
            }
          }

          "VCPKG_ROOT=$vcpkgRoot" |
            Out-File $env:GITHUB_ENV -Append
          "VCPKG_DISABLE_METRICS=1" |
            Out-File $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$root\cache\vcpkg-binaries" |
            Out-File $env:GITHUB_ENV -Append

          $env:VCPKG_ROOT = $vcpkgRoot
          $env:VCPKG_DISABLE_METRICS = '1'
          $env:VCPKG_DEFAULT_BINARY_CACHE =
            Join-Path $root 'cache\vcpkg-binaries'

          & $vcpkgExe install 'openxr:x64-windows-static'
          if ($LASTEXITCODE -ne 0) {
            throw 'Installing the documented OpenXR vcpkg triplet failed.'
          }

          $openxrConfig = Join-Path `
            $vcpkgRoot `
            'installed\x64-windows-static\share\openxr\OpenXRConfig.cmake'

          if (-not (Test-Path $openxrConfig)) {
            Get-ChildItem `
              (Join-Path $vcpkgRoot 'installed\x64-windows-static\share') `
              -Filter '*OpenXR*Config.cmake' `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "The OpenXR config expected by the upstream build script is missing: $openxrConfig"
          }

          Write-Host "Using OpenXR config: $openxrConfig"

      - name: Guard against missing optional test source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cmakeFile = 'src/mmvr-runtime/CMakeLists.txt'
          $testSource = 'tests/periodic-report-check.cpp'

          if (-not (Test-Path $cmakeFile)) {
            throw "Runtime CMake file not found: $cmakeFile"
          }

          if (Test-Path $testSource) {
            Write-Host 'Periodic-report test source exists; no workaround needed.'
            exit 0
          }

          $content = Get-Content $cmakeFile -Raw

          $pattern = '(?ms)^[ \t]*add_executable\(mmvr-periodic-report-checks[^\r\n]*\r?\n[ \t]*target_compile_definitions\(mmvr-periodic-report-checks[^\r\n]*\r?\n[ \t]*target_link_libraries\(mmvr-periodic-report-checks[^\r\n]*\r?\n[ \t]*add_test\(NAME mmvr-periodic-report-checks COMMAND mmvr-periodic-report-checks\r?\n[ \t]*"\$\{CMAKE_CURRENT_BINARY_DIR\}/periodic-report-artifacts"\)\r?\n?'

          $replacement = @'
          if(EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/../../tests/periodic-report-check.cpp")
              add_executable(mmvr-periodic-report-checks "${CMAKE_CURRENT_SOURCE_DIR}/../../tests/periodic-report-check.cpp")
              target_compile_definitions(mmvr-periodic-report-checks PRIVATE NOMINMAX WIN32_LEAN_AND_MEAN)
              target_link_libraries(mmvr-periodic-report-checks PRIVATE mmvr-core)
              add_test(NAME mmvr-periodic-report-checks COMMAND mmvr-periodic-report-checks
                  "${CMAKE_CURRENT_BINARY_DIR}/periodic-report-artifacts")
          endif()
          '@

          $updated = [regex]::Replace(
            $content,
            $pattern,
            $replacement,
            1
          )

          if ($updated -eq $content) {
            throw 'Could not locate the expected periodic-report test block. No CMake change was made.'
          }

          Set-Content -LiteralPath $cmakeFile -Value $updated -NoNewline

          Write-Host 'Applied CI-only guard for the absent optional test source.'
          Write-Host 'The repository file is changed only in this runner workspace.'

      - name: Build Windows support archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ./tools/build-vr-first-person.ps1 -Step All

          if ($LASTEXITCODE -ne 0) {
            throw 'Windows support archive build/install failed.'
          }

          $archive = 'run/vr-first-person/2ship.o2r'

          if (-not (Test-Path $archive -PathType Leaf)) {
            throw "Expected support archive was not produced: $archive"
          }

          python -c "import pathlib,zipfile; p=pathlib.Path(r'run/vr-first-person/2ship.o2r'); assert p.is_file() and p.stat().st_size > 0, 'Archive missing or empty'; z=zipfile.ZipFile(p); bad=z.testzip(); assert bad is None, f'Corrupt archive entry: {bad}'; print(f'Validated {p}: {p.stat().st_size} bytes, {len(z.namelist())} entries')"

          if ($LASTEXITCODE -ne 0) {
            throw 'Support archive validation failed.'
          }

      - name: Configure Quest native build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ./tools/build-quest.ps1 -Step Configure

          if ($LASTEXITCODE -ne 0) {
            throw 'Quest CMake configuration failed.'
          }

          if (-not (Test-Path 'build/android-quest/build.ninja')) {
            throw 'Quest configure completed without producing build.ninja.'
          }

      - name: Compile Quest native libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ./tools/build-quest.ps1 -Step Native -Jobs 2

          if ($LASTEXITCODE -ne 0) {
            throw 'Quest native compilation failed.'
          }

          $buildRoot = 'build/android-quest'

          foreach ($name in @(
            'lib2ship.so',
            'libSDL2.so',
            'libopenxr_loader.so',
            'libmmvr_extract.so'
          )) {
            $matches = @(
              Get-ChildItem -LiteralPath $buildRoot `
                -Filter $name -File -Recurse
            )

            if ($matches.Count -ne 1) {
              throw "Expected exactly one $name after native build; found $($matches.Count)."
            }

            if ($matches[0].Length -eq 0) {
              throw "Native library is empty: $($matches[0].FullName)"
            }

            Write-Host "Verified native library: $($matches[0].FullName)"
          }

      - name: Package and verify Quest APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ./tools/build-quest.ps1 -Step Apk

          if ($LASTEXITCODE -ne 0) {
            throw 'Quest APK packaging failed.'
          }

          $apk = 'releases/quest-preview/MMVR-Quest-preview.apk'

          if (-not (Test-Path $apk -PathType Leaf)) {
            throw "Expected APK was not produced: $apk"
          }

          $apksigner = Join-Path `
            $env:ANDROID_HOME `
            'build-tools\35.0.0\apksigner.bat'

          if (-not (Test-Path $apksigner)) {
            throw "apksigner was not found: $apksigner"
          }

          & $apksigner verify --verbose --print-certs $apk

          if ($LASTEXITCODE -ne 0) {
            throw 'APK signature verification failed.'
          }

          Get-FileHash -LiteralPath $apk -Algorithm SHA256

      - name: Upload Quest APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMVR-Quest-preview
          path: releases/quest-preview/MMVR-Quest-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmvr-build-diagnostics
          path: |
            logs/**
            build/android-quest/CMakeCache.txt
            build/android-quest/build.ninja
            run/vr-first-person/2ship.o2r
          if-no-files-found: warn
          retention-days: 7
