name: Build Majora's Mask VR Quest APK

on:
  push:
    branches:
      - develop
      - quest-restart-feature
  pull_request:
    branches:
      - develop
      - quest-restart-feature
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quest-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-2ship-otr:
    name: Generate 2ship.o2r (Ubuntu)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat src/2ship2harkinian/.github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool ninja-build

      - name: Install latest SDL
        run: |
          mkdir -p deps
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
          cd deps/SDL2-2.30.3
          ./configure --enable-hidapi-libusb
          make -j 10
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - name: Install latest tinyxml2
        run: |
          sudo apt-get remove -y libtinyxml2-dev || true
          mkdir -p deps
          wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
          tar -xzf 10.0.0.tar.gz -C deps
          cd deps/tinyxml2-10.0.0
          mkdir -p build
          cd build
          cmake ..
          make
          sudo make install

      - name: Generate 2ship.o2r
        run: |
          cmake --no-warn-unused-cli -Hsrc/2ship2harkinian -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
          cmake --build build-cmake --config Release --target Generate2ShipOtr -j3
          mkdir -p run/vr-first-person
          cp build-cmake/mm/2ship.o2r run/vr-first-person/2ship.o2r

      - name: Upload 2ship.o2r
        uses: actions/upload-artifact@v4
        with:
          name: ship-otr
          path: run/vr-first-person/2ship.o2r
          retention-days: 3

  build-quest-apk:
    name: Build Quest APK
    needs: generate-2ship-otr
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download 2ship.o2r
        uses: actions/download-artifact@v4
        with:
          name: ship-otr
          path: run/vr-first-person

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.3'

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973

      - name: Force install and verify Android NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ANDROID_HOME) {
            $env:ANDROID_HOME = $env:ANDROID_SDK_ROOT
          }

          if (-not $env:ANDROID_HOME) {
            throw "ANDROID_HOME and ANDROID_SDK_ROOT are both missing."
          }

          $cmdlineTools = Join-Path $env:ANDROID_HOME 'cmdline-tools'

          if (-not (Test-Path $cmdlineTools)) {
            throw "Android command-line tools directory not found: $cmdlineTools"
          }

          $sdkmanager = Get-ChildItem `
            -Path $cmdlineTools `
            -Filter 'sdkmanager.bat' `
            -Recurse -File |
            Select-Object -First 1

          if (-not $sdkmanager) {
            throw "sdkmanager.bat was not found under $cmdlineTools"
          }

          Write-Host "Using SDK manager: $($sdkmanager.FullName)"
          Write-Host "Android SDK: $env:ANDROID_HOME"

          & $sdkmanager.FullName `
            "--sdk_root=$env:ANDROID_HOME" `
            "--install" `
            "ndk;27.0.12077973"

          if ($LASTEXITCODE -ne 0) {
            throw "sdkmanager failed to install NDK 27.0.12077973."
          }

          $ndk = Join-Path $env:ANDROID_HOME 'ndk\27.0.12077973'
          $ndkBuild = Join-Path $ndk 'ndk-build.cmd'
          $sourceProperties = Join-Path $ndk 'source.properties'

          if (-not (Test-Path $ndkBuild)) {
            throw "NDK build tool is missing: $ndkBuild"
          }

          if (-not (Test-Path $sourceProperties)) {
            throw "NDK source.properties is missing: $sourceProperties"
          }

          $revision = Get-Content $sourceProperties |
            Select-String '^\s*Pkg\.Revision\s*='

          if (-not $revision -or $revision.Line -notmatch '27\.0\.12077973') {
            throw "Installed NDK revision does not match 27.0.12077973. Found: $revision"
          }

          "ANDROID_HOME=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          "ANDROID_NDK_HOME=$ndk" >> $env:GITHUB_ENV
          "ANDROID_NDK_ROOT=$ndk" >> $env:GITHUB_ENV

          Write-Host "Verified Android NDK 27.0.12077973 at $ndk"

      - name: Configure build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ANDROID_HOME) {
            $env:ANDROID_HOME = $env:ANDROID_SDK_ROOT
          }

          if (-not $env:ANDROID_HOME) {
            throw "Android SDK location was not configured."
          }

          $ndk = Join-Path $env:ANDROID_HOME 'ndk\27.0.12077973'

          if (-not (Test-Path (Join-Path $ndk 'ndk-build.cmd'))) {
            throw "Required Android NDK was not found or is incomplete: $ndk"
          }

          "ANDROID_HOME=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          "ANDROID_NDK_HOME=$ndk" >> $env:GITHUB_ENV
          "ANDROID_NDK_ROOT=$ndk" >> $env:GITHUB_ENV
          "JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV

          New-Item -ItemType Directory -Force -Path `
            'cache/tmp', `
            'logs' | Out-Null

          java -version
          python --version
          cmake --version
          ninja --version

          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_NDK_HOME=$ndk"

      - name: Skip unavailable optional test source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $cmakeFile = Join-Path $root 'src\mmvr-runtime\CMakeLists.txt'
          $testSource = Join-Path $root 'tests\periodic-report-check.cpp'

          if ((Test-Path $cmakeFile) -and -not (Test-Path $testSource)) {
            $lines = [System.Collections.Generic.List[string]]::new()

            Get-Content -LiteralPath $cmakeFile | ForEach-Object {
              $lines.Add($_)
            }

            $start = -1

            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'add_executable\(mmvr-periodic-report-checks') {
                $start = $i
                break
              }
            }

            if ($start -ge 0) {
              $end = -1

              for ($i = $start; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match 'periodic-report-artifacts"\)') {
                  $end = $i
                  break
                }
              }

              if ($end -lt 0) {
                throw "Could not locate the end of the optional test block."
              }

              $lines.RemoveRange($start, $end - $start + 1)
              Set-Content -LiteralPath $cmakeFile -Value $lines

              Write-Host "Skipped optional test with missing source."
            }
            else {
              Write-Host "Optional test block not present; no change required."
            }
          }
          else {
            Write-Host "Optional test source exists or runtime CMake file is absent."
          }

      - name: Verify 2ship.o2r archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'run\vr-first-person\2ship.o2r'

          if (!(Test-Path $archive)) {
            throw "Support archive was not downloaded: $archive"
          }

          python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); print('Archive entries:',len(z.namelist())); sys.exit(1 if bad else 0)" "$archive"

          if ($LASTEXITCODE -ne 0) {
            throw "Support archive validation failed."
          }

      - name: Configure Quest build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & ./tools/build-quest.ps1 -Step Configure

          if ($LASTEXITCODE -ne 0) {
            throw "Quest CMake configuration failed."
          }

      - name: Build Quest native libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & ./tools/build-quest.ps1 -Step Native -Jobs 2

          if ($LASTEXITCODE -ne 0) {
            throw "Quest native library build failed."
          }

      - name: Package and sign Quest APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & ./tools/package-quest.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "Quest APK packaging failed."
          }

          $apk = Join-Path $env:GITHUB_WORKSPACE `
            'releases\quest-preview\MMVR-Quest-preview.apk'

          if (!(Test-Path $apk)) {
            throw "Expected APK was not generated: $apk"
          }

          $apksigner = Get-ChildItem `
            -Path (Join-Path $env:ANDROID_HOME 'build-tools\35.0.0') `
            -Filter 'apksigner.bat' `
            -File |
            Select-Object -First 1

          if (!-not $apksigner) {
            throw "Android apksigner was not found."
          }

          & $apksigner.FullName verify --verbose $apk

          if ($LASTEXITCODE -ne 0) {
            throw "APK signature verification failed."
          }

          Get-Item $apk | Select-Object FullName, Length

      - name: Upload Quest APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMVR-Quest-preview
          path: releases/quest-preview/MMVR-Quest-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMVR-Quest-build-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
