
name: Build Majora's Mask VR Quest APK

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quest-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-quest-apk:
    name: Build Quest APK
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.3'

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973

      - name: Configure Android environment
        shell: pwsh
        run: |
          if (-not $env:ANDROID_HOME) {
            if ($env:ANDROID_SDK_ROOT) {
              $env:ANDROID_HOME = $env:ANDROID_SDK_ROOT
            } else {
              throw "ANDROID_HOME was not set by Android SDK setup."
            }
          }

          "ANDROID_HOME=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          "ANDROID_NDK_HOME=$env:ANDROID_HOME/ndk/27.0.12077973" >> $env:GITHUB_ENV
          "ANDROID_NDK_ROOT=$env:ANDROID_HOME/ndk/27.0.12077973" >> $env:GITHUB_ENV

          New-Item -ItemType Directory -Force -Path `
            "cache/tmp", `
            "cache/vcpkg-binaries", `
            "downloads/vcpkg", `
            "logs" | Out-Null

          java -version
          python --version
          cmake --version
          ninja --version

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE 'toolchains\vcpkg'

          if (-not (Test-Path (Join-Path $vcpkgRoot 'vcpkg.exe'))) {
            if (Test-Path $vcpkgRoot) {
              $items = @(Get-ChildItem -LiteralPath $vcpkgRoot -Force -ErrorAction SilentlyContinue)

              if ($items.Count -gt 0) {
                throw "The vcpkg directory exists but vcpkg.exe is missing: $vcpkgRoot"
              }
            } else {
              New-Item -ItemType Directory -Force -Path (Split-Path $vcpkgRoot -Parent) | Out-Null
            }

            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to clone vcpkg."
            }
          }

          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed."
          }

          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_DOWNLOADS=$env:GITHUB_WORKSPACE/downloads/vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE/cache/vcpkg-binaries" >> $env:GITHUB_ENV
          "VCPKG_DISABLE_METRICS=1" >> $env:GITHUB_ENV
          "VCPKG_MAX_CONCURRENCY=8" >> $env:GITHUB_ENV

      - name: Install OpenXR dependencies
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE 'toolchains\vcpkg\vcpkg.exe'

          & $vcpkg install openxr:x64-windows-static

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg failed to install openxr:x64-windows-static."
          }

          $openxrConfig = Join-Path $env:GITHUB_WORKSPACE `
            'toolchains\vcpkg\installed\x64-windows-static\share\openxr\OpenXRConfig.cmake'

          if (-not (Test-Path $openxrConfig)) {
            throw "OpenXRConfig.cmake was not found at the path expected by the upstream build script: $openxrConfig"
          }

      - name: Guard against missing optional test source
        shell: pwsh
        run: |
          $cmakeFile = Join-Path $env:GITHUB_WORKSPACE `
            'src\mmvr-runtime\CMakeLists.txt'

          if (-not (Test-Path $cmakeFile)) {
            throw "Runtime CMakeLists.txt was not found: $cmakeFile"
          }

          $content = Get-Content -LiteralPath $cmakeFile -Raw

          $pattern = '(?s)add_executable\(mmvr-periodic-report-checks\s+"\$\{CMAKE_CURRENT_SOURCE_DIR\}/\.\./\.\./tests/periodic-report-check\.cpp"\)\s*target_compile_definitions\(mmvr-periodic-report-checks PRIVATE NOMINMAX WIN32_LEAN_AND_MEAN\)\s*target_link_libraries\(mmvr-periodic-report-checks PRIVATE mmvr-core\)\s*add_test\(NAME mmvr-periodic-report-checks COMMAND mmvr-periodic-report-checks\s+"\$\{CMAKE_CURRENT_BINARY_DIR\}/periodic-report-artifacts"\)'

          if ($content -match $pattern) {
            $testSource = Join-Path $env:GITHUB_WORKSPACE `
              'tests\periodic-report-check.cpp'

            if (-not (Test-Path $testSource)) {
              $replacement = @'
if(EXISTS "${CMAKE_CURRENT_SOURCE_DIR}/../../tests/periodic-report-check.cpp")
    add_executable(mmvr-periodic-report-checks "${CMAKE_CURRENT_SOURCE_DIR}/../../tests/periodic-report-check.cpp")
    target_compile_definitions(mmvr-periodic-report-checks PRIVATE NOMINMAX WIN32_LEAN_AND_MEAN)
    target_link_libraries(mmvr-periodic-report-checks PRIVATE mmvr-core)
    add_test(NAME mmvr-periodic-report-checks COMMAND mmvr-periodic-report-checks
        "${CMAKE_CURRENT_BINARY_DIR}/periodic-report-artifacts")
endif()
'@

              $updated = [regex]::Replace(
                $content,
                $pattern,
                $replacement,
                1
              )

              if ($updated -eq $content) {
                throw "Could not apply the missing optional test-source guard."
              }

              Set-Content -LiteralPath $cmakeFile -Value $updated -NoNewline
              Write-Host "Skipped optional periodic-report test because its source file is absent."
            }
          } else {
            Write-Host "The periodic-report test block differs from the expected upstream version; no change made."
          }

      - name: Build Windows VR support archive
        shell: pwsh
        run: |
          ./tools/build-vr-first-person.ps1 -Step All

          if ($LASTEXITCODE -ne 0) {
            throw "Windows VR support build failed."
          }

          $archive = Join-Path $env:GITHUB_WORKSPACE `
            'run\vr-first-person\2ship.o2r'

          if (-not (Test-Path $archive)) {
            throw "The Windows VR support archive was not generated: $archive"
          }

          python -c "import sys,zipfile; p=sys.argv[1]; z=zipfile.ZipFile(p); bad=z.testzip(); print(f'Archive: {p}'); print(f'Entries: {len(z.namelist())}'); print(f'First invalid entry: {bad}'); sys.exit(1 if bad else 0)" "$archive"

          if ($LASTEXITCODE -ne 0) {
            throw "The generated support archive failed ZIP validation."
          }

      - name: Configure Quest native build
        shell: pwsh
        run: |
          ./tools/build-quest.ps1 -Step Configure

          if ($LASTEXITCODE -ne 0) {
            throw "Quest CMake configuration failed."
          }

          $buildNinja = Join-Path $env:GITHUB_WORKSPACE `
            'build\android-quest\build.ninja'

          if (-not (Test-Path $buildNinja)) {
            throw "Quest CMake configuration did not generate build.ninja."
          }

      - name: Build Quest native libraries
        shell: pwsh
        run: |
          ./tools/build-quest.ps1 -Step Native -Jobs 2

          if ($LASTEXITCODE -ne 0) {
            throw "Quest native build failed."
          }

          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'build\android-quest'

          $requiredLibraries = @(
            'lib2ship.so',
            'libSDL2.so',
            'libopenxr_loader.so',
            'libmmvr_extract.so'
          )

          foreach ($library in $requiredLibraries) {
            $matches = @(
              Get-ChildItem -LiteralPath $buildDir `
                -Filter $library -File -Recurse
            )

            if ($matches.Count -eq 0) {
              throw "Required native library was not generated: $library"
            }

            foreach ($file in $matches) {
              if ($file.Length -le 0) {
                throw "Native library is empty: $($file.FullName)"
              }

              Write-Host "$($file.FullName) ($($file.Length) bytes)"
            }
          }

      - name: Package and sign Quest APK
        shell: pwsh
        run: |
          ./tools/build-quest.ps1 -Step Apk

          if ($LASTEXITCODE -ne 0) {
            throw "Quest APK packaging failed."
          }

          $apk = Join-Path $env:GITHUB_WORKSPACE `
            'releases\quest-preview\MMVR-Quest-preview.apk'

          if (-not (Test-Path $apk)) {
            throw "Expected APK was not generated: $apk"
          }

          if ((Get-Item -LiteralPath $apk).Length -le 0) {
            throw "The generated APK is empty."
          }

          $apksigner = Join-Path $env:ANDROID_HOME `
            'build-tools\35.0.0\apksigner.bat'

          if (-not (Test-Path $apksigner)) {
            throw "Android apksigner was not found: $apksigner"
          }

          & $apksigner verify --verbose $apk

          if ($LASTEXITCODE -ne 0) {
            throw "APK signature verification failed."
          }

          Get-FileHash -LiteralPath $apk -Algorithm SHA256

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: MMVR-Quest-preview
          path: releases/quest-preview/MMVR-Quest-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs and support archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMVR-build-diagnostics
          path: |
            logs/**
            run/vr-first-person/2ship.o2r
          if-no-files-found: warn
          retention-days: 7
