name: Build Majora's Mask VR Quest APK

on:
  push:
    branches:
      - develop
      - quest-restart-feature
  pull_request:
    branches:
      - develop
      - quest-restart-feature
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quest-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-2ship-otr:
    name: Generate 2ship.o2r (Ubuntu)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          DEPS_FILE="src/2ship2harkinian/.github/workflows/apt-deps.txt"
          test -f "$DEPS_FILE"

          # Normalize Windows line endings and remove blank/comment lines.
          mapfile -t DEPS < <(
            sed 's/\r$//; s/#.*$//' "$DEPS_FILE" |
              tr ' ' '\n' |
              sed '/^[[:space:]]*$/d'
          )

          if [ "${#DEPS[@]}" -eq 0 ]; then
            echo "::error::No dependencies found in $DEPS_FILE"
            exit 1
          fi

          echo "Installing dependencies:"
          printf '  %s\n' "${DEPS[@]}"

          sudo apt-get install -y \
            "${DEPS[@]}" \
            libzip-dev \
            zipcmp \
            zipmerge \
            ziptool \
            ninja-build

      - name: Install SDL 2.30.3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p deps
          wget -q \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz

          tar -xzf SDL2-2.30.3.tar.gz -C deps
          cd deps/SDL2-2.30.3

          ./configure --enable-hidapi-libusb
          make -j"$(nproc)"
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - name: Install tinyxml2 10.0.0
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get remove -y libtinyxml2-dev || true

          mkdir -p deps
          wget -q \
            https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz

          tar -xzf 10.0.0.tar.gz -C deps
          cmake -S deps/tinyxml2-10.0.0 \
                -B deps/tinyxml2-10.0.0/build \
                -DCMAKE_BUILD_TYPE=Release

          cmake --build deps/tinyxml2-10.0.0/build \
            --parallel "$(nproc)"

          sudo cmake --install deps/tinyxml2-10.0.0/build

      - name: Configure host build
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S src/2ship2harkinian \
            -B build-cmake \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Generate 2ship.o2r
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build-cmake \
            --config Release \
            --target Generate2ShipOtr \
            --parallel 3

          ARCHIVE=$(find build-cmake -name "2ship.o2r" -type f | head -n 1)
          DEST="run/vr-first-person/2ship.o2r"

          if [ -z "$ARCHIVE" ] || [ ! -s "$ARCHIVE" ]; then
            echo "::error::Generated support archive is missing or empty in build-cmake"
            exit 1
          fi

          mkdir -p "$(dirname "$DEST")"
          cp "$ARCHIVE" "$DEST"

          echo "Generated support archive from $ARCHIVE:"
          ls -lh "$DEST"

      - name: Validate support archive
        shell: bash
        run: |
          set -euo pipefail

          python - run/vr-first-person/2ship.o2r <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]

          if not zipfile.is_zipfile(path):
              raise SystemExit(f"Not a valid ZIP-compatible OTR archive: {path}")

          with zipfile.ZipFile(path) as archive:
              entries = archive.namelist()
              bad_entry = archive.testzip()

          if bad_entry:
              raise SystemExit(f"Corrupt archive entry: {bad_entry}")

          if not entries:
              raise SystemExit("Support archive contains no entries")

          print(f"Validated {path}: {len(entries)} entries")
          PY

      - name: Upload support archive
        uses: actions/upload-artifact@v4
        with:
          name: ship-otr
          path: run/vr-first-person/2ship.o2r
          if-no-files-found: error
          retention-days: 3

  build-quest-apk:
    name: Build Quest APK
    needs: generate-2ship-otr
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download support archive
        uses: actions/download-artifact@v4
        with:
          name: ship-otr
          path: run/vr-first-person

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.3'

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.0.12077973

      - name: Verify Android SDK and NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ANDROID_HOME) {
            $env:ANDROID_HOME = $env:ANDROID_SDK_ROOT
          }

          if (-not $env:ANDROID_HOME) {
            throw "ANDROID_HOME and ANDROID_SDK_ROOT are both missing."
          }

          $cmdlineTools = Join-Path $env:ANDROID_HOME 'cmdline-tools'

          if (-not (Test-Path -LiteralPath $cmdlineTools)) {
            throw "Android command-line tools directory not found: $cmdlineTools"
          }

          $sdkmanager = Get-ChildItem `
            -Path $cmdlineTools `
            -Filter 'sdkmanager.bat' `
            -Recurse -File |
            Select-Object -First 1

          if (-not $sdkmanager) {
            throw "sdkmanager.bat was not found under $cmdlineTools"
          }

          Write-Host "Using SDK manager: $($sdkmanager.FullName)"
          Write-Host "Android SDK: $env:ANDROID_HOME"

          & $sdkmanager.FullName `
            "--sdk_root=$env:ANDROID_HOME" `
            "--install" `
            "ndk;27.0.12077973"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Android NDK 27.0.12077973."
          }

          $ndk = Join-Path $env:ANDROID_HOME 'ndk\27.0.12077973'
          $ndkBuild = Join-Path $ndk 'ndk-build.cmd'
          $sourceProperties = Join-Path $ndk 'source.properties'

          if (-not (Test-Path -LiteralPath $ndkBuild)) {
            throw "NDK build tool is missing: $ndkBuild"
          }

          if (-not (Test-Path -LiteralPath $sourceProperties)) {
            throw "NDK source.properties is missing: $sourceProperties"
          }

          $revision = Get-Content -LiteralPath $sourceProperties |
            Select-String '^\s*Pkg\.Revision\s*='

          if (-not $revision -or $revision.Line -notmatch '27\.0\.12077973') {
            throw "Installed NDK revision is incorrect. Found: $revision"
          }

          "ANDROID_HOME=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          "ANDROID_NDK_HOME=$ndk" >> $env:GITHUB_ENV
          "ANDROID_NDK_ROOT=$ndk" >> $env:GITHUB_ENV

          Write-Host "Verified NDK at $ndk"

      - name: Configure build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:ANDROID_HOME) {
            $env:ANDROID_HOME = $env:ANDROID_SDK_ROOT
          }

          if (-not $env:ANDROID_HOME) {
            throw "Android SDK location was not configured."
          }

          $ndk = Join-Path $env:ANDROID_HOME 'ndk\27.0.12077973'

          if (-not (Test-Path -LiteralPath (Join-Path $ndk 'ndk-build.cmd'))) {
            throw "Required Android NDK was not found or is incomplete: $ndk"
          }

          "ANDROID_HOME=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" >> $env:GITHUB_ENV
          "ANDROID_NDK_HOME=$ndk" >> $env:GITHUB_ENV
          "ANDROID_NDK_ROOT=$ndk" >> $env:GITHUB_ENV
          "JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV

          New-Item -ItemType Directory -Force -Path `
            'cache/tmp', `
            'logs' | Out-Null

          java -version
          python --version
          cmake --version
          ninja --version

          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_NDK_HOME=$ndk"
          Write-Host "JAVA_HOME=$env:JAVA_HOME"

      - name: Verify downloaded support archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $archive = Join-Path $env:GITHUB_WORKSPACE 'run\vr-first-person\2ship.o2r'

          if (-not (Test-Path -LiteralPath $archive)) {
            throw "Support archive was not downloaded: $archive"
          }

          if ((Get-Item -LiteralPath $archive).Length -le 0) {
            throw "Support archive is empty: $archive"
          }

          @'
          import sys
          import zipfile

          path = sys.argv[1]

          if not zipfile.is_zipfile(path):
              raise SystemExit(f"Invalid ZIP-compatible archive: {path}")

          with zipfile.ZipFile(path) as archive:
              entries = archive.namelist()
              bad_entry = archive.testzip()

          if bad_entry:
              raise SystemExit(f"Corrupt archive entry: {bad_entry}")

          if not entries:
              raise SystemExit("Support archive contains no entries")

          print(f"Validated {path}: {len(entries)} entries")
          '@ | python - $archive

          if ($LASTEXITCODE -ne 0) {
            throw "Support archive validation failed."
          }

      - name: Configure Quest build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & ./tools/build-quest.ps1 -Step Configure

          if ($LASTEXITCODE -ne 0) {
            throw "Quest CMake configuration failed."
          }

      - name: Build Quest native libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & ./tools/build-quest.ps1 -Step Native -Jobs 2

          if ($LASTEXITCODE -ne 0) {
            throw "Quest native library build failed."
          }

      - name: Package and verify Quest APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & ./tools/package-quest.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "Quest APK packaging failed."
          }

          $apk = Join-Path $env:GITHUB_WORKSPACE `
            'releases\quest-preview\MMVR-Quest-preview.apk'

          if (-not (Test-Path -LiteralPath $apk)) {
            throw "Expected APK was not generated: $apk"
          }

          if ((Get-Item -LiteralPath $apk).Length -le 0) {
            throw "Generated APK is empty: $apk"
          }

          $signer = Join-Path $env:ANDROID_HOME `
            'build-tools\35.0.0\apksigner.bat'

          if (-not (Test-Path -LiteralPath $signer)) {
            throw "Android apksigner was not found: $signer"
          }

          & $signer verify --verbose --print-certs $apk

          if ($LASTEXITCODE -ne 0) {
            throw "APK signature verification failed."
          }

          Get-FileHash -LiteralPath $apk -Algorithm SHA256
          Get-Item -LiteralPath $apk |
            Select-Object FullName, Length

      - name: Upload Quest APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMVR-Quest-preview
          path: releases/quest-preview/MMVR-Quest-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MMVR-Quest-build-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
