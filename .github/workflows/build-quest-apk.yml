
name: Build Majora's Mask VR Quest APK

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quest-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-quest-apk:
    name: Build Quest APK
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.26.4"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          sdkmanager --install `
            "platforms;android-35" `
            "build-tools;35.0.0" `
            "ndk;27.0.12077973"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK component installation failed."
          }

          "ANDROID_HOME=$env:ANDROID_HOME" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          cmake --version
          if ($LASTEXITCODE -ne 0) {
            throw "CMake verification failed."
          }

      - name: Set Android NDK environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ndkPath = Join-Path $env:ANDROID_HOME "ndk\27.0.12077973"

          if (!(Test-Path $ndkPath)) {
            throw "Android NDK not found: $ndkPath"
          }

          "ANDROID_NDK_HOME=$ndkPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          "ANDROID_NDK_ROOT=$ndkPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Android NDK: $ndkPath"

      - name: Prepare build directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          @(
            "logs",
            "cache/tmp",
            "downloads",
            "toolchains",
            "run/vr-first-person"
          ) | ForEach-Object {
            New-Item -ItemType Directory -Force -Path $_ | Out-Null
          }

          # Do not create a placeholder 2ship.o2r.
          # The Windows build must generate the real archive.

      - name: Build Windows support archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          ./tools/build-vr-first-person.ps1 -Step All

          if ($LASTEXITCODE -ne 0) {
            throw "Windows support build failed."
          }

          $candidates = @(
            "run/vr-first-person/2ship.o2r",
            "src/2ship2harkinian/2ship.o2r",
            "build/windows-vr-first-person/2ship.o2r"
          )

          $archive = $candidates |
            Where-Object { Test-Path $_ -PathType Leaf } |
            Select-Object -First 1

          if (!$archive) {
            throw "Windows build did not produce 2ship.o2r."
          }

          $destination = "run/vr-first-person/2ship.o2r"
          $sourcePath = [System.IO.Path]::GetFullPath($archive)
          $destPath = [System.IO.Path]::GetFullPath($destination)

          if ($sourcePath -ne $destPath) {
            Copy-Item -LiteralPath $sourcePath -Destination $destPath -Force
          }

          python -c "import sys,zipfile; p=sys.argv[1]; z=zipfile.ZipFile(p); bad=z.testzip(); print('Archive entries:',len(z.namelist())); assert bad is None, f'Corrupt entry: {bad}'; assert z.namelist(), 'Archive is empty'; z.close()" $destination

          if ($LASTEXITCODE -ne 0) {
            throw "Generated 2ship.o2r is not a valid ZIP archive."
          }

          Get-Item $destination |
            Format-List Name, Length, FullName

      - name: Configure Quest native build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          ./tools/build-quest.ps1 -Step Configure

          if ($LASTEXITCODE -ne 0) {
            throw "Quest CMake configuration failed."
          }

      - name: Build Quest native libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          ./tools/build-quest.ps1 -Step Native -Jobs 2

          if ($LASTEXITCODE -ne 0) {
            throw "Quest native compilation failed."
          }

      - name: Package and sign Quest APK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          ./tools/build-quest.ps1 -Step Apk

          if ($LASTEXITCODE -ne 0) {
            throw "Quest APK packaging failed."
          }

          $apk = "releases/quest-preview/MMVR-Quest-preview.apk"

          if (!(Test-Path $apk -PathType Leaf)) {
            throw "Expected APK was not created: $apk"
          }

          $file = Get-Item $apk

          if ($file.Length -le 0) {
            throw "Generated APK is empty."
          }

          $file | Format-List Name, Length, FullName
          Get-FileHash $apk -Algorithm SHA256

      - name: Upload Quest APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Majoras-Mask-VR-Quest-APK
          path: releases/quest-preview/MMVR-Quest-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majoras-Mask-VR-Build-Logs
          path: |
            logs/**/*.log
            build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
